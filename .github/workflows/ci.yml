name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  andringar:
    runs-on: ubuntu-latest
    outputs:
      kod: ${{ steps.filter.outputs.kod }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kod:
              - "src/**"
              - "data/**"
              - "tests/**"
              - "pyproject.toml"
              - ".github/workflows/**"

  test:
    needs: andringar
    if: needs.andringar.outputs.kod == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: pytest

  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - run: python -m churn.model

      - uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

  utvardera:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skriv mätvärden i Summary
        run: |
          echo "## Mätvärden för modell-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Mått | Värde |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          jq -r 'to_entries[] | "| \(.key) | \(.value) |"' outputs/matvarden.json >> $GITHUB_STEP_SUMMARY

      - run: python -m churn.evaluate

  ci-klar:
    needs: [andringar, test, train, utvardera]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera att inget jobb misslyckades
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Något jobb misslyckades."
            exit 1
          fi
          echo "Allt OK."